<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Confirmar correo | AMAC</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@700&family=Work+Sans:wght@400;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/confirmar_correo.css">
</head>

<body>

  <header class="encabezado">
    <div class="contenedor encabezado__interior">

      <a class="logo" href="index.html">
        <svg class="logo__icono" viewBox="0 0 60 28" aria-hidden="true">
          <polyline
            points="3,24 14,5 24,20 34,4 44,20 57,7"
            fill="none"
            stroke="currentColor"
            stroke-width="5"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
        </svg>

        <span class="logo__texto">
          <span class="logo__nombre">AMAC</span>
          <span class="logo__lema">asociAMayores A.C.</span>
        </span>
      </a>

    </div>
  </header>

  <main class="contenedor principal">

    <section class="confirmacion">

      <div class="confirmacion__icono">
        ✉
      </div>

      <h1>Confirma tu correo</h1>

      <p class="confirmacion__texto">
        Te enviamos un código de 6 números a
        <strong>diana@correo.com</strong>
      </p>

      <div class="codigo">
        <input type="text" maxlength="1" aria-label="Número 1">
        <input type="text" maxlength="1" aria-label="Número 2">
        <input type="text" maxlength="1" aria-label="Número 3">
        <input type="text" maxlength="1" aria-label="Número 4">
        <input type="text" maxlength="1" aria-label="Número 5">
        <input type="text" maxlength="1" aria-label="Número 6">
      </div>

      <div class="aviso">
        <span>!</span>
        <p>
          El código llega en menos de 2 minutos.
          Revisa también la carpeta de correo no deseado.
        </p>
      </div>

      <div class="acciones">
        <button class="boton boton--primario" type="button">
          Confirmar
        </button>

        <button class="boton boton--secundario" type="button">
          Reenviar código
        </button>
      </div>

    </section>

  </main>

</body>
</html>
